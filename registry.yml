# Every app the port campaign covers.
#
# app  — what the app is called
# repo — where its source lives upstream
# fork — our copy of it in the org
# license — upstream's SPDX licence, taken from its own <project_license>
#           metainfo declaration. The port inherits upstream's licence; it
#           never gets a new one. A compound expression (one containing AND)
#           is refused by converge-port-gems until someone decides how a
#           single `spec.licenses` entry should state it.
#
# `check-gnome-apps-site` adds entries here by pull request when it finds an app
# with no fork. `fork-new-gtk-apps` reads this file and creates any fork that
# does not exist yet. Nothing else goes in this file.

