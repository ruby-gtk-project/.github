# The port campaign's registry. Nothing is forked, issued or scaffolded that
# is not listed here; adding an entry is what causes those things to happen.
#
# New entries arrive by pull request from the `Scan app sources` workflow, so
# a person approves every app before the machinery acts on it.
#
# `forked` is fact: the fork exists and `upstream` is its real parent on
# GitHub. `candidates` are apps on apps.gnome.org with no fork yet — none of
# them are on GitHub, so each needs a GitHub home found before it can be
# forked. That is a judgement, not a URL rewrite: Apostrophe lives at
# gitlab.gnome.org/World/apostrophe but its GitHub home is
# ApostropheEditor/Apostrophe, which no rule derives from the GitLab URL.

forked:
  - fork: Apostrophe-rb
    upstream: ApostropheEditor/Apostrophe
    upstream_branch: master
